# ============================================================
# CI パイプライン — push / PR 時に自動実行
# ============================================================
# このファイルが GitHub Actions の「設計図」。
# .github/workflows/ に置くだけで GitHub が自動認識する。
# ============================================================

name: CI（テスト＆コード品質チェック）

# ── いつ実行するか ──
on:
  push:
    branches: [main]        # main へ push したら実行
  pull_request:
    branches: [main]        # main への PR が作られたら実行

# ── 何をやるか ──
jobs:

  # ────────────────────────────────────────────
  # Job 1: コード品質チェック（lint）
  # ────────────────────────────────────────────
  lint:
    name: コード品質チェック（ruff）
    runs-on: ubuntu-latest

    steps:
      # 1. コードを取得
      - uses: actions/checkout@v4

      # 2. Python をセットアップ
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. ruff をインストール
      - run: pip install ruff

      # 4. lint 実行 — コードの書き方チェック
      - name: ruff でコード品質チェック
        run: ruff check src/ tests/ --ignore I001

  # ────────────────────────────────────────────
  # Job 2: テスト実行
  # ────────────────────────────────────────────
  test:
    name: pytest でテスト実行
    runs-on: ubuntu-latest
    needs: lint              # ← lint が通ってからテストを実行

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 必要なライブラリをインストール
      - run: pip install -r requirements.txt

      # pytest 実行 — -v で詳細表示
      - name: テスト実行
        run: pytest tests/ -v
